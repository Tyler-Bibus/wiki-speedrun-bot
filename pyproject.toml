[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-speedrun-bot"
version = "0.1.0"
description = "A small Wikispeedia baseline using Kev link decisions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
train = [
    "kev",
    "torch==2.8.0+cu128; sys_platform == 'linux'",
    "flash-linear-attention[cuda]==0.5.2; sys_platform == 'linux'",
    # Official wheel for the pinned WSL training stack; avoids a CUDA toolkit build.
    "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0%2Bcu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl#sha256=a1fcd5d022b67ddfc9e1c291f890004c1c081a03d66b532f6eebe31219168e0e ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

[tool.uv.sources]
kev = { git = "https://github.com/jaredpalmer/kev.git", rev = "6b719c3c3f367295f6ef336f4f751cf5ff970abc" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
wiki-speedrun = "wiki_speedrun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
