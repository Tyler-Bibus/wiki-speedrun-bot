# All 51,318 completed paths in the pinned SNAP archive, before route validation.
# Separate outputs preserve the original 2,000-path experiment and its checkpoints.
schema_version = 1
seed = 42
data_dir = "data"
run_dir = "runs/snap-full"

[model]
# Independent copy of the same released weights used to initialize the pilot.
checkpoint = "checkpoints/comparison-untuned-kev-0.8b-bf75a6a"
kev_revision = "6b719c3c3f367295f6ef336f4f751cf5ff970abc"
device = "cuda"
weights_dtype = "fp32"
autocast_dtype = "bf16"
temperature = 1.0

[choices]
strategy = "tournament"
node_max_choices = 64
max_state_tokens = 1024
max_row_tokens = 4096
excerpt_chars = 1500
grouping = "source_order"

[data]
max_paths = 51318
split_manifest = "data/splits/snap-full/manifest.json"
sft_train = "data/training/snap-full/sft_train.jsonl"
sft_dev = "data/training/snap-full/sft_dev.jsonl"
rl_train_tasks = "data/splits/snap-full/train_tasks.json"
dev_tasks = "data/splits/snap-full/dev_tasks.json"
test_tasks = "data/splits/snap-full/test_tasks.json"

[sft]
# One complete shuffled pass; the high update ceiling does not truncate this data.
epochs = 1
max_updates = 100000
learning_rate = 0.00002
microbatch_size = 1
gradient_accumulation = 8

[rl]
# Optional bounded comparison. Supply --init-from with the new SFT checkpoint.
max_steps = 12
updates = 200
task_pairs_per_update = 2
episodes_per_pair = 2
learning_rate = 0.000005
gamma = 1.0
entropy_coefficient = 0.0
max_grad_norm = 1.0

[reward]
success = 1.0
failure = -1.0
step_cost = 0.02

[save]
checkpoint_every_updates = 250
keep_last_checkpoints = 2
evaluate_every_updates = 1000
evaluation_max_tasks = 64
